name: Collect Crypto GEX Data

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gex-collector
  cancel-in-progress: false

jobs:

  collect:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Deribit option snapshot
        run: |
          python collector.py

      - name: Commit snapshot
        run: |

          git config user.name "GEX Collector"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw

          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi

          git commit -m "GEX snapshot $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          git push
